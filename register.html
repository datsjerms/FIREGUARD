<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FIREGUARD Monitoring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <h1>FIREGUARD</h1>
        <p class="subtitle">Household Monitoring System</p>

     <input type="text" id="username" placeholder="System Username">
<input type="password" id="password" placeholder="Password">

<p id="error" style="color:red; display:none; margin-top:10px;">
    ❌ Invalid username or password.

</p>
        .

        <button onclick="login()">Start Monitoring</button>

        .
         <p class="subtitle">New Household System?</p>
    
        <button onclick="Register()">Register System

        </button>
    </div>

    <script>
function login() {

    // USERS with PASSWORD + DASHBOARD PAGE
    const users = {
        "admin": {
            password: "jem",
            dashboard: "dashboard.html"
        },
        "admin2": {
            password: "jra",
            dashboard: "jradashboard.html"
        },
        "admin3": {
            password: "jay",
            dashboard: "jaydashboard.html"
        },
        "admin4": {
            password: "bry",
            dashboard: "brydashboard.html"
        }
}

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("error");

    // Check if user exists
    if (users[username] && users[username].password === password) {
        // Redirect to that user's dashboard
        window.location.href = users[username].dashboard
    } else {
        errorMsg.style.display = "block"
    }
}
        
        function Register() {
            // Simple redirect (no backend yet)
            window.location.href = "register.html";
        }
    </script>




</body>
</html>
