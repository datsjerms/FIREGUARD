<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FIREGUARD Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <header class="dashboard-header">
        <h1>🔥 DASHBOARD NI JRA</h1>
        <span class="logo">FIREGUARD</span>
    </header>

    <section class="dashboard-grid">

        <div class="card">
            <h3>Fire Incidents</h3>
            <p class="big-number">1</p>
        </div>

        <div class="card">
            <h3>Average Response Time</h3>
            <p class="big-number">4.5 <span>mins</span></p>
        </div>

        <div class="card">
            <h3>Total Employees</h3>
            <p class="big-number">375</p>
        </div>

        <div class="card neon">
            <h3>Extinguisher Compliance</h3>
            <p class="big-number">78%</p>
        </div>

        <div class="card">
            <h3>Fire Alarms Compliance</h3>
            <p class="big-number">71%</p>
        </div>

        <div class="card">
            <h3>Fire Hydrant Compliance</h3>
            <p class="big-number">88%</p>
        </div>

        <div class="card circle">
            <h3>Drill Participation</h3>
            <p class="big-number">80%</p>
        </div>

        <div class="card circle">
            <h3>Employees Trained</h3>
            <p class="big-number">65%</p>
        </div>

    </section>

</body>
</html>
